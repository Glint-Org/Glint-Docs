<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glint Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Glint documentation - turn real app UI into Play Store and App Store screenshots."
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #c9a227;
    }
    .sidebar > h1 a {
      font-weight: 700;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'Glint Docs',
      repo: 'https://github.com/Glint-Org/Glint-Docs',
      homepage: 'README.md',
      loadSidebar: true,
      autoHeader: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
